name: url-download
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to download'
        required: true
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="${{ github.event.inputs.url }}"
          if [[ "$URL" == *"raw.githubusercontent.com"* || "$URL" == *"api.github.com"* ]]; then
            if [[ "$URL" == *"/contents/"* ]]; then
              gh api "$URL" -H "Accept: application/vnd.github.raw" > artifact.bin
            else
              curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o artifact.bin "$URL"
            fi
          else
            curl -fL --retry 3 -o artifact.bin "$URL"
          fi
      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="download-$(date +%s)"
          gh release create "$TAG" artifact.bin --repo "$GITHUB_REPOSITORY" --title "Download $(date -u +%Y%m%d-%H%M%S)" --generate-notes || true
